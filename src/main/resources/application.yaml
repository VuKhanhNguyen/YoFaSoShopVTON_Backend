spring:
  application:
    name: yofasoshop-backend
  config:
    import: "optional:file:./.env[.properties]"
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yofasoshop_db?connectionTimeZone=UTC}
    username: ${DB_USERNAME:yofaso_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  password-reset:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET:}
  rate-limit: ${RATE_LIMIT_PER_MINUTE:120}
  cors:
    origins: ${CORS_ORIGINS:}
  runtime-root: ${BACKEND_RUNTIME_ROOT:./data/runtime}
  storage-root: ${STORAGE_LOCAL_ROOT:./data/storage}
  catalog:
    public-base-url: ${R2_PUBLIC_BASE_URL:}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    key: ${AI_INTERNAL_API_KEY:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_SUBMIT_TIMEOUT_SECONDS:15}
    poll-ms: ${AI_POLL_INTERVAL_MS:3000}
    enabled: ${AI_POLL_ENABLED:true}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
